name: CI
# Every proposed change validates code, production images, and the CDK source.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Integration tests exercise the real PostgreSQL repository and migrations.
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: paylens, POSTGRES_USER: paylens, POSTGRES_PASSWORD: ci-only-password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paylens -d paylens" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest
        env: { PAYLENS_TEST_DATABASE_URL: "postgresql+psycopg://paylens:ci-only-password@localhost:5432/paylens" }
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build the exact Dockerfiles deployed by the pilot workflow.
      - run: docker build -t paylens-backend:ci .
      - run: docker run --rm paylens-backend:ci python -m app.admin.provision_user --help
      - run: docker build -t paylens-frontend:ci frontend
      - name: Probe production containers
        run: |
          docker run -d --name paylens-api-ci -p 8000:8000 paylens-backend:ci
          docker run -d --name paylens-web-ci -p 3000:3000 paylens-frontend:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs paylens-api-ci
          docker logs paylens-web-ci
          exit 1
      - name: Stop production containers
        if: always()
        run: |
          docker rm -f paylens-api-ci paylens-web-ci 2>/dev/null || true
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: infrastructure/package-lock.json }
      # Compilation catches invalid constructs; audit rejects vulnerable production dependencies.
      - working-directory: infrastructure
        run: npm ci
      - working-directory: infrastructure
        run: npm run build
      - working-directory: infrastructure
        run: npm audit --omit=dev
