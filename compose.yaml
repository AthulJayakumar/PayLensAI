services:
  # Local development database; credentials are intentionally non-production defaults.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paylens}
      POSTGRES_USER: ${POSTGRES_USER:-paylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paylens-local-only}
    ports:
      - "5432:5432"
    volumes:
      - paylens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  # Preserve local transaction and analysis state across container restarts.
  paylens-postgres:
